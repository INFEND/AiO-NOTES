name: Signed Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: aio-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing secret
        env:
          SIGNING: ${{ secrets.AIO_SIGNING_BUNDLE }}
        run: |
          set -eu
          if [ -z "$SIGNING" ]; then echo "::error::Add AIO_SIGNING_BUNDLE in repository Actions secrets"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/aio-sign"
          printf '%s' "$SIGNING" | base64 -d > "$RUNNER_TEMP/aio-sign/bundle.zip"
          unzip -q "$RUNNER_TEMP/aio-sign/bundle.zip" -d "$RUNNER_TEMP/aio-sign"
          PASSWORD=$(cat "$RUNNER_TEMP/aio-sign/password.txt")
          echo "::add-mask::$PASSWORD"
          echo "AIO_KEYSTORE=$RUNNER_TEMP/aio-sign/release.p12" >> "$GITHUB_ENV"
          echo "AIO_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Build
        run: gradle --no-daemon :app:assembleRelease -PreleaseCode="$GITHUB_RUN_NUMBER" -PreleaseName="1.0.$GITHUB_RUN_NUMBER"
      - name: Verify and prepare OTA
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AiO-NOTES.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/AiO-NOTES.apk
          python3 - <<'PY'
          import os, hashlib, json
          n=int(os.environ['GITHUB_RUN_NUMBER'])
          p='dist/AiO-NOTES.apk'
          data={'versionCode':n,'versionName':f'1.0.{n}','sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'size':os.path.getsize(p),'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v1.0.{n}/AiO-NOTES.apk'}
          open('dist/update.json','w').write(json.dumps(data))
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.$GITHUB_RUN_NUMBER" dist/AiO-NOTES.apk dist/update.json --target "$GITHUB_SHA" --title "AiO NOTES 1.0.$GITHUB_RUN_NUMBER" --generate-notes
